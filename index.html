<div style={{fontSize:9,fontWeight:700,letterSpacing:3,textTransform:"uppercase",color:T,border:`1px solid ${T}`,padding:"4px 10px",width:"fit-content"}}>{modal.type==="exclu"?"⚡ Édition Limitée":"Radar EV Path"}</div>
<div style={{fontSize:mob?22:28,fontWeight:900,letterSpacing:2,textTransform:"uppercase",lineHeight:1}}>{modal.name}</div>
<div style={{fontSize:mob?36:42,fontWeight:900,color:T,lineHeight:1}}>{modal.price}€</div>
<div style={{display:"flex",flexDirection:"column",gap:7}}>
{["Verre Prizm — Contraste optimisé","Monture O Matter™ — Ultra légère","Grip Unobtainium® — Anti-sueur","Protection UV400 certifiée"].map(f=><div key={f} style={{display:"flex",alignItems:"center",gap:9,fontSize:12,color:"rgba(244,244,242,0.6)"}}><span style={{width:5,height:5,background:T,borderRadius:"50%",flexShrink:0}}/>{f}</div>)}
</div>
<button style={{background:T,color:D,border:"none",padding:"14px",fontSize:11,fontWeight:700,letterSpacing:3,textTransform:"uppercase",cursor:"pointer",marginTop:4}} onClick={()=>add(modal)}>Ajouter au panier</button>
</div>
</div>
</div>}

{cartOpen&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:200}} onClick={()=>setCartOpen(false)}/>}
<div style={{position:"fixed",top:0,right:0,bottom:0,width:mob?"100%":"340px",background:"#111113",borderLeft:mob?"none":"1px solid rgba(129,216,208,0.08)",zIndex:300,transform:cartOpen?"translateX(0)":"translateX(100%)",transition:"transform .32s ease",display:"flex",flexDirection:"column"}}>
<div style={{padding:"20px 20px 16px",borderBottom:"1px solid rgba(158,160,163,0.08)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
<span style={{fontSize:18,fontWeight:900,letterSpacing:2,textTransform:"uppercase"}}>MON PANIER</span>
<button onClick={()=>setCartOpen(false)} style={{width:36,height:36,background:"#222",border:"none",color:W,cursor:"pointer",fontSize:16,borderRadius:4}}>✕</button>
</div>
<div style={{flex:1,overflowY:"auto",padding:"14px 20px",display:"flex",flexDirection:"column",gap:12}}>
{cart.length===0?<div style={{textAlign:"center",paddingTop:60,color:N}}><div style={{fontSize:48,marginBottom:14}}>🕶️</div><p style={{fontSize:11,fontWeight:700,letterSpacing:2,textTransform:"uppercase"}}>Ton panier est vide</p></div>:cart.map(item=><div key={item.id} style={{display:"flex",gap:12,paddingBottom:14,borderBottom:"1px solid rgba(158,160,163,0.08)"}}>
<div style={{width:64,height:52,background:D,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,borderRadius:4}}>🕶️</div>
<div style={{flex:1}}><div style={{fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:5}}>{item.name}</div><div style={{fontSize:20,fontWeight:900,color:T}}>{item.price*item.qty}€ <span style={{fontSize:12,color:N,fontWeight:300}}>× {item.qty}</span></div></div>
<button onClick={()=>rem(item.id)} style={{background:"none",border:"none",color:N,cursor:"pointer",fontSize:16,alignSelf:"flex-start",padding:"4px"}}>✕</button>
</div>)}
</div>
<div style={{padding:"14px 20px 32px",borderTop:"1px solid rgba(158,160,163,0.08)"}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><span style={{fontSize:11,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:N}}>Total</span><span style={{fontSize:32,fontWeight:900}}>{tot}€</span></div>
<button style={{width:"100%",background:T,color:D,border:"none",padding:"16px",fontSize:12,fontWeight:700,letterSpacing:3,textTransform:"uppercase",cursor:"pointer",borderRadius:2}} onClick={()=>alert("Redirection vers Shopify — Total : "+tot+"€")}>Commander →</button>
</div>
</div>
</div>
);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
